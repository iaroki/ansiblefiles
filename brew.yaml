---

- name: "Install Brew packages"
  hosts: "localhost"
  connection: "local"
  gather_facts: false
  roles:
    - {role: "brew",    tags: "brew", become: true }
  vars:
    packages:
      enabled:
        install: true
        remove: true
      install:
        - "lazygit"
        - "neovim"
        - "mpv"
        - "eza"
        - "bat"
        - "glow"
        - "ripgrep"
        - "fzf"
        - "fd"
        - "jq"
        - "yq"
        - "tree"
        - "btop"
        - "mosh"
        - "sshpass"
        - "zbar"
        - "tlrc"  # tldr
        - "just"
        - "go"
        - "gopls"
        - "gcc"
        - "make"
        - "vifm"
        - "cbonsai"
        - "newsboat"
        - "terraform-docs"
        - "terraform-ls"
        - "tflint"
        - "terragrunt"
        - "shellcheck"
        - "docker-ls"
        - "awscli"
        - "k9s"
        - "kubectl"
        - "kubectx"
        - "helm"
        - "helm-ls"
        - "helmfile"
        - "cmake"
        - "sops"
        - "bash-language-server"
        - "yamllint"
        - "yaml-language-server"
        - "docker-ls"
        - "stow"
        - "npm"
        - "font-vollkorn"
        - "font-fira-sans"
        - "font-fira-code-nerd-font"
        - "font-iosevka-nerd-font"
        - "font-iosevka-etoile"
        - "claude-code"
        # mac section
        # - "ansible"
        # - "ansible-lint"
        # - "ansible-language-server"
